<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1200" viewBox="0 0 1320 1200" role="img" aria-labelledby="title desc"><title id="title">Modelo de dados do OScar</title><desc id="desc">Doze entidades de domínio e duas tabelas associativas. As setas indicam relações principais por chave estrangeira; a fonte Mermaid e o SQL registram todas as relações.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#57908b"/></marker></defs><rect width="1320" height="1200" fill="#f4f7f8"/><text x="30" y="44" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#173b4b">OScar — modelo relacional do MySQL</text><text x="30" y="73" font-family="Arial,sans-serif" font-size="14" fill="#5c727e">PK: chave primária · FK: chave estrangeira · principais campos e relações do atendimento</text><path d="M165 295V370" fill="none" stroke="#57908b" stroke-width="2" marker-end="url(#arrow)" opacity=".8"/><path d="M300 160H360" fill="none" stroke="#57908b" stroke-width="2" marker-end="url(#arrow)" opacity=".8"/><path d="M300 430H360" fill="none" stroke="#57908b" stroke-width="2" marker-end="url(#arrow)" opacity=".8"/><path d="M495 295V370" fill="none" stroke="#57908b" stroke-width="2" marker-end="url(#arrow)" opacity=".8"/><path d="M495 565V640" fill="none" stroke="#57908b" stroke-width="2" marker-end="url(#arrow)" opacity=".8"/><path d="M360 520H330V880H495V910" fill="none" stroke="#57908b" stroke-width="2" marker-end="url(#arrow)" opacity=".8"/><path d="M825 295V370" fill="none" stroke="#57908b" stroke-width="2" marker-end="url(#arrow)" opacity=".8"/><path d="M630 225H660V425H690" fill="none" stroke="#57908b" stroke-width="2" marker-end="url(#arrow)" opacity=".8"/><path d="M630 500H660V695H690" fill="none" stroke="#57908b" stroke-width="2" marker-end="url(#arrow)" opacity=".8"/><path d="M1155 295V370" fill="none" stroke="#57908b" stroke-width="2" marker-end="url(#arrow)" o