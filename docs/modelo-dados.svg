.5" fill="#243d49">status</text></g><g transform="translate(690,100)"><rect width="270" height="195" rx="10" fill="#fff" stroke="#b8c9d0"/><path d="M10 0H260Q270 0 270 10V40H0V10Q0 0 10 0" fill="#173b4b"/><text x="14" y="26" font-family="Consolas,monospace" font-size="16" font-weight="700" fill="#fff">services</text><text x="14" y="66" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">id · PK</text><text x="14" y="90" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">name / description</text><text x="14" y="114" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">price / durationMinutes</text><text x="14" y="138" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">purpose / active</text></g><g transform="translate(1020,100)"><rect width="270" height="195" rx="10" fill="#fff" stroke="#b8c9d0"/><path d="M10 0H260Q270 0 270 10V40H0V10Q0 0 10 0" fill="#173b4b"/><text x="14" y="26" font-family="Consolas,monospace" font-size="16" font-weight="700" fill="#fff">suppliers</text><text x="14" y="66" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">id · PK</text><text x="14" y="90" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">name / cnpj · UNIQUE</text><text x="14" y="114" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">contact / leadDays</text><text x="14" y="138" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">active</text></g><g transform="translate(30,370)"><rect width="270" height="195" rx="10" fill="#fff" stroke="#b8c9d0"/><path d="M10 0H260Q270 0 270 10V40H0V10Q0 0 10 0" fill="#173b4b"/><text x="14" y="26" font-family="Consolas,monospace" font-size="16" font-weight="700" fill="#fff">vehicles</text><text x="14" y="66" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">id · PK</text><text x="14" y="90" font-family="Arial,sans-serif" font-size="12.5" fill="#a74a16">clientId · FK</text><text x="14" y="114" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">plate / chassis · UNIQUE</text><text x="14" y="138" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">brand / model / year / mileage</text><text x="14" y="162" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">active / registrationStatus</text></g><g transform="translate(360,370)"><rect width="270" height="195" rx="10" fill="#fff" stroke="#b8c9d0"/><path d="M10 0H260Q270 0 270 10V40H0V10Q0 0 10 0" fill="#173b4b"/><text x="14" y="26" font-family="Consolas,monospace" font-size="16" font-weight="700" fill="#fff">orders</text><text x="14" y="66" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">id · PK / number · UNIQUE</text><text x="14" y="90" font-family="Arial,sans-serif" font-size="12.5" fill="#a74a16">clientId / vehicleId · FK</text><text x="14" y="114" font-family="Arial,sans-serif" font-size="12.5" fill="#a74a16">mechanicId / appointmentId · FK</text><text x="14" y="138" font-family="Arial,sans-serif" font-size="12.5" fill="#a74a16">originOrderId · FK</text><text x="14" y="162" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">status / closedAt</text></g><g transform="translate(690,370)"><rect width="270" height="195" rx="10" fill="#fff" stroke="#b8c9d0"/><path d="M10 0H260Q270 0 270 10V40H0V10Q0 0 10 0" fill="#173b4b"/><text x="14" y="26" font-family="Consolas,monospace" font-size="16" font-weight="700" fill="#fff">appointment_services</text><text x="14" y="66" font-family="Arial,sans-serif" font-size="12.5" fill="#a74a16">appointmentId · PK, FK</text><text x="14" y="90" font-family="Arial,sans-serif" font-size="12.5" fill="#a74a16">serviceId · PK, FK</text><text x="14" y="114" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">Relação N:N entre agendamento</text><text x="14" y="138" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">e catálogo de serviços</text></g><g transform="translate(1020,370)"><rect width="270" height="195" rx="10" fill="#fff" stroke="#b8c9d0"/><path d="M10 0H260Q270 0 270 10V40H0V10Q0 0 10 0" fill="#173b4b"/><text x="14" y="26" font-family="Consolas,monospace" font-size="16" font-weight="700" fill="#fff">parts</text><text x="14" y="66" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">id · PK / code · UNIQUE</text><text x="14" y="90" font-family="Arial,sans-serif" font-size="12.5" fill="#a74a16">supplierId · FK</text><text x="14" y="114" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">description / unit</text><text x="14" y="138" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">cost / price / stock</text><text x="14" y="162" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">manualMinimum / active</text></g><g transform="translate(30,640)"><rect width="270" height="195" rx="10" fill="#fff" stroke="#b8c9d0"/><path d="M10 0H260Q270 0 270 10V40H0V10Q0 0 10 0" fill="#173b4b"/><text x="14" y="26" font-family="Consolas,monospace" font-size="16" font-weight="700" fill="#fff">service_requests</text><text x="14" y="66" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">id · PK</text><text x="14" y="90" font-family="Arial,sans-serif" font-size="12.5" fill="#a74a16">clientId / vehicleId · FK (opcionais)</text><text x="14" y="114" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">name / phone / vehicle / plate</text><text x="14" y="138" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">symptoms / preferredDate</text><text x="14" y="162" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">status / total / durationMinutes</text></g><g transform="translate(360,640)"><rect width="270" height="195" rx="10" fill="#fff" stroke="#b8c9d0"/><path d="M10 0H260Q270 0 270 10V40H0V10Q0 0 10 0" fill="#173b4b"/><text x="14" y="26" font-family="Consolas,monospace" font-size="16" font-weight="700" fill="#fff">budgets</text><text x="14" y="66" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">id · PK / number · UNIQUE</text><text x="14" y="90" font-family="Arial,sans-serif" font-size="12.5" fill="#a74a16">orderId · FK</text><text x="14" y="114" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">status / publishedAt / expiresAt</text><text x="14" y="138" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">answeredAt / tokenHash / link</text></g><g transform="translate(690,640)"><rect width="270" height="195" rx="10" fill="#fff" stroke="#b8c9d0"/><path d="M10 0H260Q270 0 270 10V40H0V10Q0 0 10 0" fill="#173b4b"/><text x="14" y="26" font-family="Consolas,monospace" font-size="16" font-weight="700" fill="#fff">order_items</text><text x="14" y="66" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">orderId / itemId / section · PK</text><text x="14" y="90" font-family="Arial,sans-serif" font-size="12.5" fill="#a74a16">orderId / serviceId / partId · FK</text><text x="14" y="114" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">kind / description</text><text x="14" y="138" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">quantity / price / decision</text></g><g transform="translate(30,910)"><rect width="270" height="195" rx="10" fill="#fff" stroke="#b8c9d0"/><path d="M10 0H260Q270 0 270 10V40H0V10Q0 0 10 0" fill="#173b4b"/><text x="14" y="26" font-family="Consolas,monospace" font-size="16" font-weight="700" fill="#fff">users</text><text x="14" y="66" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">id · PK</text><text x="14" y="90" font-family="Arial,sans-serif" font-size="12.5" fill="#a74a16">clientId · FK (opcional)</text><text x="14" y="114" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">name / email · UNIQUE</text><text x="14" y="138" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">passwordHash / role / active</text></g><g transform="translate(360,910)"><rect width="270" height="195" rx="10" fill="#fff" stroke="#b8c9d0"/><path d="M10 0H260Q270 0 270 10V40H0V10Q0 0 10 0" fill="#173b4b"/><text x="14" y="26" font-family="Consolas,monospace" font-size="16" font-weight="700" fill="#fff">tickets</text><text x="14" y="66" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">id · PK</text><text x="14" y="90" font-family="Arial,sans-serif" font-size="12.5" fill="#a74a16">orderId / clientId · FK</text><text x="14" y="114" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">status / description / notes</text></g><g transform="translate(690,910)"><rect width="270" height="195" rx="10" fill="#fff" stroke="#b8c9d0"/><path d="M10 0H260Q270 0 270 10V40H0V10Q0 0 10 0" fill="#173b4b"/><text x="14" y="26" font-family="Consolas,monospace" font-size="16" font-weight="700" fill="#fff">movements</text><text x="14" y="66" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">id · PK</text><text x="14" y="90" font-family="Arial,sans-serif" font-size="12.5" fill="#a74a16">partId / orderId · FK</text><text x="14" y="114" font-family="Arial,sans-serif" font-size="12.5" fill="#a74a16">supplierId / userId · FK</text><text x="14" y="138" font-family="Arial,sans-serif" font-size="12.5" fill="#243d49">type / quantity / date / notes</text></g><g transform="translate(1020,670)"><rect width="270" height="260" rx="10" fill="#e8f1ef" stroke="#b8d4ce"/><text x="16" y="30" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#173b4b">Como ler o modelo</text><text x="16" y="62" font-family="Arial,sans-serif" font-size="13" fill="#243d49"><tspan x="16" dy="0">Um registro pode se ligar a</tspan><tspan x="16" dy="21">vários registros dependentes.</tspan><tspan x="16" dy="32">Exemplo: um cliente possui</tspan><tspan x="16" dy="21">vários veículos e atendimentos.</tspan><tspan x="16" dy="32">Campos JSON conservam inspeções,</tspan><tspan x="16" dy="21">decisões e retratos históricos.</tspan><tspan x="16" dy="32">Detalhes completos:</tspan><tspan x="16" dy="21">modelo-dados.mmd e mysql-schema.sql</tspan></text></g><text x="30" y="1160" font-family="Arial,sans-serif" font-size="13" fill="#5c727e">Registros de suporte: sessions, reset_tokens, settings, audit, emails, backups e tombstones. Setas mostram as relações principais; demais FKs estão na DDL.</text></svg>
