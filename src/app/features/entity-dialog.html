<h2 mat-dialog-title>{{data.title}}</h2><mat-dialog-content><mat-card appearance="outlined" class="entity-form-card"><mat-card-content><form [formGroup]="form" (ngSubmit)="save()" id="entity-form" class="form-grid"><ng-container *ngFor="let field of data.fields"><mat-slide-toggle *ngIf="field.type==='boolean'" [formControlName]="field.key" class="wide">{{field.label}}</mat-slide-toggle><mat-form-field appearance="outline" *ngIf="field.type!=='boolean'" [class.wide]="field.type==='textarea'||field.type==='lines'"><mat-label>{{field.label}}</mat-label><mat-select *ngIf="field.type==='select'" [formControlName]="field.key" [multiple]="!!field.multiple"><mat-option *ngIf="!field.required&&!field.multiple" [value]="null">Não informado</mat-option><mat-option *ngFor="let option of options(field)" [value]="option.value">{{option.label}}</mat-option></mat-select><textarea matInput *ngIf="field.type==='textarea'||field.type==='lines'" [formControlName]="field.key" rows="4"></textarea><input matInput *ngIf="field.type!=='textarea'&&field.type!=='lines'&&field.type!=='select'" [type]="field.type||'text'" [formControlName]="field.key" [attr.min]="field.min??null" [attr.max]="field.max??null" [attr.step]="field.type==='number'?'any':null" [attr.autocomplete]="field.type==='password'?'new-password':null"><mat-hint *ngIf="field.help">{{field.help}}</mat-hint><mat-error *ngIf="invalid(field)">{{validationMessage(field)}}</mat-error></mat-form-field></ng-container><p class="form-error wide" role="alert" *ngIf="error">{{error}}</p></form></mat-card-content></mat-card></mat-dialog-content><mat-dialog-actions align="end"><button mat-button [mat-dialog-close]="false" [disabled]="busy">Cancelar</button><button mat-flat-button form="entity-form" type="submit" [disabled]="busy||form.invalid">{{busy?'Salvando…':'Salvar'}}</button></mat-dialog-actions>
